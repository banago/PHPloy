; This is a sample phploy.ini file. You can specify as many servers as you
; need, using normal or quickmode configuration.
;
; NOTE: If a value contains any non-alphanumeric characters it needs to be
; enclosed in double-quotes (").

; The special '*' configuration is shared between all other configurations
; (think of it as an include of default values).
[*]
    exclude[] = 'src/*'
    include[] = "dist/app.css"

[staging]
    scheme = sftp
    host = staging-example.com
    user = example
    ; When connecting via SFTP, opt for password-based authentication:
    pass = password
    ; Or private key-based authentication:
    ; privkey = 'path/to/or/contents/of/privatekey'
    path = /path/to/installation
    port = 22
    ; Deploy only this branch:
    branch = develop
    ; File permissions set on uploaded files/directories:
    permissions = 0700
    ; File permissions set on newly created directories:
    directoryPerm = 0775
    ; Deploy only this directory as the base directory:
    ; base = 'directory-name/'
    ; Files ignored and not uploaded, but still tracked in the repo:
    exclude[] = '*.ini'
    ; Files ignored by Git that you still want to upload:
    include[] = 'directory-name/'
    ; Conditional include - upload the target only if the source changed:
    include[] = 'css/style.min.css:src/style.css'
    ; Directories copied after deploy (from->to):
    ; copy[] = 'public->www'
    ; Directories purged before deploy:
    purge-before[] = "dist/"
    ; Directories purged after deploy:
    purge[] = "cache/"
    ; Pre- and post-deploy hooks:
    ; Use "DQUOTE" inside your double-quoted strings to insert a literal double quote
    ; Use 'QUOTE' inside your quoted strings to insert a literal quote
    pre-deploy[] = "wget http://staging-example.com/pre-deploy/test.php --spider --quiet"
    post-deploy[] = "wget http://staging-example.com/post-deploy/test.php --spider --quiet"
    ; Remote hooks (run on the server over SSH2):
    pre-deploy-remote[] = "touch .maintenance"
    post-deploy-remote[] = "rm .maintenance"
    ; Connection timeout in seconds (useful for long-running remote operations):
    timeout = 60

[production]
    quickmode = ftp://example:password@production-example.com:21/path/to/installation
    passive = true
    ssl = false
    branch = master
    permissions = 0774
    directoryPerm = 0755
    exclude[] = 'libs/*'
    exclude[] = 'config/*'
    include[] = 'js/style.min.css'
    purge-before[] = "dist/"
    purge[] = "cache/"
    pre-deploy[] = "wget http://production-example.com/pre-deploy/test.php --spider --quiet"
    post-deploy[] = "wget http://production-example.com/post-deploy/test.php --spider --quiet"
