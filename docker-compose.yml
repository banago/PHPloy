services:
  ftp-server:
    image: fauria/vsftpd
    environment:
      - FTP_USER=testuser
      - FTP_PASS=testpass

  sftp-server:
    image: atmoz/sftp
    command: testuser:testpass:::upload

  phploy-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    command: tail -f /dev/null
    depends_on:
      - ftp-server
      - sftp-server
